# Encrypted gp3 StorageClass provisioned by the Amazon EBS CSI driver.
#
# - Not a default StorageClass on purpose: the Jenkins PVC must reference it
#   explicitly via storageClassName.
# - WaitForFirstConsumer delays volume creation until a Pod is scheduled, so
#   the EBS volume is created in that Pod's Availability Zone (EBS volumes
#   attach only to nodes in their own AZ).
# - encrypted is explicit because EBS encryption-by-default is off on this
#   AWS account; without kmsKeyId, the AWS-managed aws/ebs key is used.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: taskflow-gp3
  labels:
    app.kubernetes.io/part-of: taskflow
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
  csi.storage.k8s.io/fstype: ext4
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
