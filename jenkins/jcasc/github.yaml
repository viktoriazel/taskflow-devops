# GitHub plugin configuration as code.
#
# configs is empty on purpose. Jenkins does not manage webhooks through the
# GitHub API, so it needs no GitHub API token. The webhook is created on the
# GitHub side, and Jenkins only receives its deliveries.
#
# hookSecretConfigs holds the id of the Jenkins credential with the shared
# secret, which is used to check the signature on each delivery.

unclassified:
  githubpluginconfig:
    configs: []

    # The credential is defined in jenkins/jcasc/credentials.yaml.
    hookSecretConfigs:
      - credentialsId: "github-webhook-secret"
        # Set explicitly to match the X-Hub-Signature-256 header GitHub sends.
        # The GitHub webhook must use the same secret.
        signatureAlgorithm: "SHA256"
