# GitHub webhook credential.
#
# The secret value is resolved by JCasC from the file mounted by the Jenkins
# chart. No credential value is stored in this configuration.

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "github-webhook-secret"
              description: "Shared secret for GitHub webhook signature validation"
              secret: "${jenkins-github-webhook-secret}"
