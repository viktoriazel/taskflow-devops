# Pipeline job definitions as code.
#
# The Job DSL plugin contributes the "jobs" root element below, so these
# definitions are applied by the same Configuration as Code reload that applies
# the rest of jenkins/jcasc/. Nothing here is configured through the Jenkins UI.
#
# The DSL regenerates each job's configuration on every reload, so a job is
# created once and afterwards updated in place: repeated runs cannot leave a
# second copy behind. Because the generated configuration replaces the whole
# job, only settings that must exist *before* a build starts are declared here.
# Everything a Declarative pipeline applies at the start of each run - options,
# timeouts, build retention - stays in its Jenkinsfile and is not duplicated.
#
# No credential appears here and none is required: the repository is public and
# both jobs check it out anonymously.

jobs:
  - script: |
      // Both jobs read their pipeline from the same repository and the same
      // branch. Set once here: this is the only place either is chosen.
      String repositoryUrl = 'https://github.com/viktoriazel/taskflow-devops.git'
      String scmBranch     = 'jenkins-cicd'

      pipelineJob('ci-application') {
          description(
              'Builds, scans and publishes the three application images. ' +
              'Defined by ci-Jenkinsfile; runs on a dynamic CI agent and deploys nothing.'
          )

          definition {
              cpsScm {
                  scm {
                      git {
                          remote {
                              url(repositoryUrl)
                          }
                          branch('*/' + scmBranch)
                      }
                  }

                  scriptPath('ci-Jenkinsfile')

                  // Fetches the pipeline file alone. A full checkout here would
                  // clone the repository onto the controller, which carries no
                  // executors and runs no build work; the pipeline checks the
                  // source out on its own agent instead.
                  lightweight(true)
              }
          }
      }

      pipelineJob('application-cd') {
          description(
              'Deploys an image that the ci-application job already built, scanned and published. ' +
              'Defined by cd-Jenkinsfile; builds nothing.'
          )

          // Declared here only so the job is parameterised before its first
          // build. A Declarative pipeline registers its parameters while it
          // runs, which is too late for the run that has to supply them, and
          // this generated configuration would drop them again on the next
          // reload. During a build, cd-Jenkinsfile is what is in force.
          parameters {
              stringParam(
                  'IMAGE_TAG', '',
                  'Image tag produced by CI, for example git-<short-sha>-b<build>-<run>. "latest" is rejected.'
              )
              stringParam(
                  'CI_BUILD_NUMBER', '',
                  'Build number of the ci-application run that produced the tag above.'
              )
              choiceParam(
                  'ENVIRONMENT', ['dev'],
                  'Target environment.'
              )
              textParam(
                  'RELEASE_NOTE', '',
                  'Optional free-text note recorded in the rollout history.'
              )
          }

          definition {
              cpsScm {
                  scm {
                      git {
                          remote {
                              url(repositoryUrl)
                          }
                          branch('*/' + scmBranch)
                      }
                  }

                  scriptPath('cd-Jenkinsfile')
                  lightweight(true)
              }
          }
      }
