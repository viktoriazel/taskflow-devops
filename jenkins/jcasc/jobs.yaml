# Pipeline job definitions as code.
#
# The Job DSL plugin adds the "jobs" element below, so these jobs are applied by
# the same Configuration as Code reload as the rest of jenkins/jcasc/. Nothing
# here is set up through the Jenkins UI.
#
# Every reload regenerates the job configuration, so only settings that must
# exist before a build starts are declared here. The pipeline logic itself lives
# in the Jenkinsfile of each job.
#
# No credentials are needed: the repository is public and both jobs check it out
# anonymously.

jobs:
  - script: |
      // Both jobs use the same repository and the same branch, set once here.
      String repositoryUrl = 'https://github.com/viktoriazel/taskflow-devops.git'
      String scmBranch     = 'main'

      pipelineJob('ci-application') {
          description(
              'Builds, scans and publishes the three application images. ' +
              'Defined by ci-Jenkinsfile; runs on a dynamic CI agent and deploys nothing.'
          )

          // A push to the branch above arrives as a GitHub webhook and starts a
          // build. The trigger has to be on the job: a pipeline only registers
          // its own triggers once it is already running.
          //
          // Only this job has a trigger. Deployments are started on purpose,
          // from an image CI has already published.
          triggers {
              githubPush()
          }

          definition {
              cpsScm {
                  scm {
                      git {
                          remote {
                              url(repositoryUrl)
                          }
                          branch('*/' + scmBranch)
                      }
                  }

                  scriptPath('ci-Jenkinsfile')

                  // Fetches only the pipeline file. The controller runs no build
                  // work, so the pipeline checks out the source on its own agent.
                  lightweight(true)
              }
          }
      }

      pipelineJob('application-cd') {
          description(
              'Deploys an image that the ci-application job already built, scanned and published. ' +
              'Defined by cd-Jenkinsfile; builds nothing.'
          )

          // Declared here so the job has its parameters before the first build.
          // A pipeline only registers parameters while it runs, which is too
          // late for that first run.
          parameters {
              stringParam(
                  'IMAGE_TAG', '',
                  'Image tag produced by CI, for example git-<short-sha>-b<build>-<run>. "latest" is rejected.'
              )
              stringParam(
                  'CI_BUILD_NUMBER', '',
                  'Build number of the ci-application run that produced the tag above.'
              )
              choiceParam(
                  'ENVIRONMENT', ['dev'],
                  'Target environment.'
              )
              textParam(
                  'RELEASE_NOTE', '',
                  'Optional free-text note recorded in the rollout history.'
              )
          }

          definition {
              cpsScm {
                  scm {
                      git {
                          remote {
                              url(repositoryUrl)
                          }
                          branch('*/' + scmBranch)
                      }
                  }

                  scriptPath('cd-Jenkinsfile')
                  lightweight(true)
              }
          }
      }
