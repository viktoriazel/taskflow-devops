# Example file with a placeholder value. This is not a real Secret.
#
# The real Secret must be named jenkins-github-webhook. Never commit it to Git.
# Keep it at jenkins/secret-github-webhook.yaml — that path is Git-ignored.
#
# The key name below must match the keyName entry under
# controller.additionalExistingSecrets in jenkins/values.yaml.
#
# The value is a shared secret. GitHub uses it to sign webhook deliveries, so
# the same value must be set on the GitHub webhook.
#
# Apply the real Secret with `kubectl apply --server-side`. A client-side
# apply would copy the whole manifest, including the secret value, into the
# kubectl.kubernetes.io/last-applied-configuration annotation.
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-github-webhook-example
  namespace: jenkins
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/component: webhook
    app.kubernetes.io/part-of: taskflow
type: Opaque
stringData:
  secret: "REPLACE_WITH_GENERATED_WEBHOOK_SECRET"
