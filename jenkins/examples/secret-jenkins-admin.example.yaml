# Example only — placeholder values, not a real Secret.
#
# The real Secret must be named jenkins-admin (without the "-example" suffix),
# must exist before Jenkins is installed, and must never be committed to Git.
# A local working copy at jenkins/secret-jenkins-admin.yaml is covered by the
# repository's ignore rule, while this template stays tracked.
#
# The two key names below must match controller.admin.userKey and
# controller.admin.passwordKey in jenkins/values.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-admin-example
  namespace: jenkins
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: taskflow
type: Opaque
stringData:
  jenkins-admin-user: "REPLACE_WITH_ADMIN_USERNAME"
  jenkins-admin-password: "REPLACE_WITH_GENERATED_ADMIN_PASSWORD"
