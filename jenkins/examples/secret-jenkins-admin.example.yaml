# Example file with placeholder values. This is not a real Secret.
#
# The real Secret must be named jenkins-admin and must exist before Jenkins
# is installed. Never commit it to Git.
# Keep it at jenkins/secret-jenkins-admin.yaml — that path is Git-ignored.
#
# The key names below must match controller.admin.userKey and
# controller.admin.passwordKey in jenkins/values.yaml.
#
# Apply the real Secret with `kubectl apply --server-side`. A client-side
# apply would copy the whole manifest, including the credentials, into the
# kubectl.kubernetes.io/last-applied-configuration annotation.
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-admin-example
  namespace: jenkins
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: taskflow
type: Opaque
stringData:
  jenkins-admin-user: "REPLACE_WITH_ADMIN_USERNAME"
  jenkins-admin-password: "REPLACE_WITH_GENERATED_ADMIN_PASSWORD"
