# Jenkins controller values for the official jenkins/jenkins chart.
#
# All Helm overrides live here, not in `--set` flags or the Jenkins UI. The
# JCasC config comes from jenkins/jcasc/, and the chart version is pinned in
# jenkins/chart.env.

controller:
  # Pinned so the Jenkins version does not follow the chart's appVersion.
  image:
    registry: docker.io
    repository: jenkins/jenkins
    tag: "2.568.2-jdk21"
    # Reuse the image already on the node; this chart cannot pin a digest.
    pullPolicy: IfNotPresent

  # Admin credentials come from the jenkins-admin Secret, which is created
  # separately and never committed to Git. createSecret must stay true or the
  # chart does not mount them.
  admin:
    existingSecret: jenkins-admin
    createSecret: true
    userKey: jenkins-admin-user
    passwordKey: jenkins-admin-password

  # Mounts the webhook Secret next to the admin credentials. JCasC reads it as
  # ${jenkins-github-webhook-secret}. The Pod does not start without it.
  additionalExistingSecrets:
    - name: jenkins-github-webhook
      keyName: secret

  # Pinned versions so repeated installs do not drift. Only the plugins actually
  # used are listed.
  installPlugins:
    - kubernetes:4540.v612369217f87
    - workflow-aggregator:608.v67378e9d3db_1
    # Pinned to a version that works with the Kubernetes plugin's requirements.
    - pipeline-model-definition:2.2293.v6e7193cec599
    - git:5.10.1
    - github:1.47.0
    - configuration-as-code:2117.vc05a_0b_e6b_f4e
    - job-dsl:3732.v9a_c49a_61a_313
    - credentials-binding:728.v902a_273b_8947
    - lockable-resources:1539.v4db_b_fc1cc115
    - junit:1424.vc64a_edde7777
    - pipeline-utility-steps:3.810.va_7672d206740
    - copyartifact:795.ve8e151429b_27
    - timestamper:1.30
    - ws-cleanup:0.49

  # Chart default is true, which pulls the latest dependencies at install time.
  installLatestPlugins: false

  # Keeps the pinned versions above from being upgraded to the latest ones.
  installLatestSpecifiedPlugins: false

  # Keeps the plugin directory on the volume instead of clearing it. A newer
  # pinned version still replaces the installed one on restart.
  overwritePlugins: false

  JCasC:
    # jenkins/jcasc/ holds all system settings, the Kubernetes cloud and the
    # agent templates. The chart's own JCasC would conflict with it.
    defaultConfig: false

  # Fail the config load on an unresolved reference instead of substituting an
  # empty value.
  containerEnv:
    - name: CASC_STRICT_SECRET_RESOLUTION
      value: "true"

  # The chart default of 50m/256Mi is too small for a controller. The CPU limit
  # can be oversubscribed: under load the controller is throttled, not killed.
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: 1500m
      memory: 3Gi

  # fsGroup gives the non-root user access to the PVC, and OnRootMismatch skips
  # resetting ownership of the whole volume on every start.
  podSecurityContextOverride:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault

  # Non-root, read-only root filesystem (Jenkins only writes to mounted volumes)
  # and no Linux capabilities.
  containerSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

  # startupProbe covers the slow first boot while plugins load; liveness and
  # readiness only start once it passes.
  probes:
    startupProbe:
      httpGet:
        path: /login
        port: http
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30
    livenessProbe:
      httpGet:
        path: /whoAmI/api/json
        port: http
      initialDelaySeconds: 0
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 5
    readinessProbe:
      httpGet:
        path: /login
        port: http
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 5
      successThreshold: 1
      failureThreshold: 3

  # The JCasC reload sidecar has no resources or security context by default.
  sidecars:
    configAutoReload:
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
      containerSecurityContext:
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault

  # Run on the dedicated Jenkins node, which carries a matching taint.
  nodeSelector:
    workload: jenkins

  tolerations:
    - key: workload
      operator: Equal
      value: jenkins
      effect: NoSchedule

# The controller has its own ServiceAccount, kept separate from the agent
# identities in RBAC and audit logs.
serviceAccount:
  create: true
  name: jenkins-controller

  # The controller needs this token to manage dynamic agent Pods.
  automountServiceAccountToken: true

# The chart's RBAC is wider than the controller needs. jenkins/rbac/controller.yaml
# defines a smaller Role and is applied before the release.
rbac:
  create: false

# Jenkins home must survive Pod replacement: plugins, job configuration,
# credentials and build history.
persistence:
  enabled: true

  # Set explicitly instead of using whichever StorageClass is the default.
  storageClass: taskflow-gp3

  # EBS attaches to one node at a time, which is all a single controller needs.
  accessMode: ReadWriteOnce

  # gp3 volumes can grow but never shrink.
  size: 20Gi
