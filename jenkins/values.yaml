# Jenkins controller values for the official jenkins/jenkins chart.
#
# Every Helm override lives here rather than in an inline `--set` or the Jenkins
# UI. JCasC is deliberately not embedded in this file; it is supplied from
# jenkins/jcasc/ as reviewable YAML. The chart version is pinned in
# jenkins/chart.env.

controller:
  # Pinned so the Jenkins version does not follow the chart's appVersion.
  image:
    registry: docker.io
    repository: jenkins/jenkins
    tag: "2.568.2-jdk21"
    # Reuses the image already on the node; this chart cannot pin a digest.
    pullPolicy: IfNotPresent

  # Credentials come from the jenkins-admin Secret, created out of band and never
  # stored in Git. createSecret stays true only because the chart gates the
  # projected credential mount on it; existingSecret suppresses its own password.
  admin:
    existingSecret: jenkins-admin
    createSecret: true
    userKey: jenkins-admin-user
    passwordKey: jenkins-admin-password

  # Pinned to exact versions, with latest resolution disabled below, so repeated
  # installs do not drift. The list is kept to plugins actually used.
  installPlugins:
    - kubernetes:4540.v612369217f87
    - workflow-aggregator:608.v67378e9d3db_1
    # Pinned to stop the Declarative suite resolving into a version split that
    # the Kubernetes plugin's requirements leave unloadable.
    - pipeline-model-definition:2.2293.v6e7193cec599
    - git:5.10.1
    - github:1.47.0
    - configuration-as-code:2117.vc05a_0b_e6b_f4e
    - job-dsl:3732.v9a_c49a_61a_313
    - credentials-binding:728.v902a_273b_8947
    - lockable-resources:1539.v4db_b_fc1cc115
    - junit:1424.vc64a_edde7777
    - pipeline-utility-steps:3.810.va_7672d206740
    - copyartifact:795.ve8e151429b_27
    - timestamper:1.30
    - ws-cleanup:0.49

  # Chart default is true, which resolves dependencies to latest at install time:
  # two installs from this file would differ.
  installLatestPlugins: false

  # Guards the list above against silently resolving to "latest".
  installLatestSpecifiedPlugins: false

  # Keeps the persistent plugin directory intact instead of clearing it. A pinned
  # version newer than the installed one still replaces it on restart; moving a
  # pin backwards needs its own deliberate procedure.
  overwritePlugins: false

  JCasC:
    # jenkins/jcasc/ is the single source of truth for system settings, the
    # Kubernetes cloud and the agent templates. The chart's own JCasC would emit
    # a competing jenkins.clouds block, so it is off.
    defaultConfig: false

  # The chart's 50m/256Mi under-reserves for a controller. CPU may oversubscribe:
  # contention costs throttling, not a killed controller.
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: 1500m
      memory: 3Gi

  # fsGroup gives the non-root uid ownership of the PVC; OnRootMismatch avoids a
  # recursive chown of the volume on every start.
  podSecurityContextOverride:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault

  # Non-root with a read-only root filesystem - every path Jenkins writes to is a
  # mounted volume - and no Linux capabilities.
  containerSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

  # startupProbe absorbs slow first-boot plugin loading and gates the other two.
  # Liveness uses an endpoint that answers without authentication; readiness uses
  # the one Service traffic actually reaches.
  probes:
    startupProbe:
      httpGet:
        path: /login
        port: http
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30
    livenessProbe:
      httpGet:
        path: /whoAmI/api/json
        port: http
      initialDelaySeconds: 0
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 5
    readinessProbe:
      httpGet:
        path: /login
        port: http
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 5
      successThreshold: 1
      failureThreshold: 3

  # The JCasC reload sidecar ships with neither resources nor a security context.
  sidecars:
    configAutoReload:
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
      containerSecurityContext:
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault

  # The dedicated Jenkins node, which carries a matching taint.
  nodeSelector:
    workload: jenkins

  tolerations:
    - key: workload
      operator: Equal
      value: jenkins
      effect: NoSchedule

# Its own named identity, so the controller stays distinguishable from the agent
# identities in RBAC and audit logs.
serviceAccount:
  create: true
  name: jenkins-controller

  # The controller needs this token to manage dynamic agent Pods.
  automountServiceAccountToken: true

# The chart's RBAC is broader than the controller needs; jenkins/rbac/controller.yaml
# defines a narrower Role, applied before the release.
rbac:
  create: false

# Jenkins home must survive Pod replacement: plugins, job configuration, the
# credentials store and build history.
persistence:
  enabled: true

  # Named explicitly rather than relying on whichever StorageClass is default.
  storageClass: taskflow-gp3

  # EBS attaches to one node at a time, which is all a single controller needs.
  accessMode: ReadWriteOnce

  # gp3 can be expanded in place but never shrunk.
  size: 20Gi
