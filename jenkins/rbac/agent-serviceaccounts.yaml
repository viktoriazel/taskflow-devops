# ServiceAccounts for ephemeral Jenkins CI/CD agents.
# CI has no Kubernetes API access; CD receives namespace-scoped deployment RBAC.
---
# CI does not need the Kubernetes API, so the default ServiceAccount token is
# not mounted. AWS access is provided separately through EKS Pod Identity, which
# injects its own projected token with audience pods.eks.amazonaws.com.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-ci-agent
  namespace: jenkins
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/component: ci-agent
    app.kubernetes.io/part-of: taskflow
automountServiceAccountToken: false
---
# CD defaults to no automatic API token. Its Pod template explicitly projects
# the ServiceAccount token into the kubectl container only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-cd-agent
  namespace: jenkins
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/component: cd-agent
    app.kubernetes.io/part-of: taskflow
automountServiceAccountToken: false
