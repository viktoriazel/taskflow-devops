---
- name: Install base packages
  ansible.builtin.apt:
    name:
      - python3
      - python3-venv
      - python3-pip
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create /opt/taskflow base directory
  ansible.builtin.file:
    path: /opt/taskflow
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'
